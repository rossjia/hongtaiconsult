<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者特征审核 · PC497</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./web02.css"><script type="module" src="./app.js"></script></head>
<body>
<section id="login" class="login"><form id="login-form"><span class="eyebrow">中国硬纤维瘤 · PC497</span><h1>患者特征审核</h1><p>对照原文，核对并修订提取结果。</p><label for="code">审核代号</label><input id="code" name="code" autocomplete="username" spellcheck="false" required placeholder="输入您的代号"><button class="primary" type="submit">进入审核</button><p id="login-error" role="alert"></p><small>固定代号访问 · 大小写均可</small></form></section>
<div id="app" hidden>
 <header><div><span class="eyebrow">中国硬纤维瘤 · PC497</span><h1>患者特征审核</h1></div><div class="account"><span id="identity"></span><button id="export">导出全部497条</button><button id="logout">退出</button></div></header>
 <div id="notice" role="status" hidden></div>
 <div class="workspace">
  <aside class="library"><h2>文章 <span id="record-total"></span></h2><div id="progress"></div><input id="search" aria-label="搜索文章" placeholder="搜索编号或标题"><select id="status-filter" aria-label="筛选审核状态"><option value="">全部状态</option><option value="NOT_REVIEWED">未审核</option><option value="IN_PROGRESS">审核中</option><option value="COMPLETED">已完成</option><option value="DISCUSS">待确认</option></select><nav id="records" aria-label="文章列表"></nav></aside>
  <main><div id="review-toolbar"><select id="module-picker" aria-label="当前模块" disabled><option>主题模块</option></select></div><div id="article-head"><p class="muted">选择左侧文章开始核对</p></div><nav id="modules" aria-label="主题模块"></nav><div id="cards"></div><footer id="review-footer" hidden><span id="review-status"></span><button id="complete" class="primary">完成本篇审核</button></footer></main>
  <section class="pdf-pane" aria-label="PDF原文"><div class="pdf-top"><strong>原文核对</strong><span id="source-label"></span></div><div class="source-tools"><select id="source-select" aria-label="来源文献"></select><button id="open-source">打开全文</button></div><div class="pdf-tools"><button id="evidence-back" title="返回上一证据">返回证据</button><button id="pdf-prev" aria-label="上一页">‹</button><span id="page-number">—</span><button id="pdf-next" aria-label="下一页">›</button><select id="zoom" aria-label="缩放"><option value="fit">适合宽度</option><option value="1">100%</option><option value="1.5">150%</option><option value="1.75">175%</option></select><button id="rotate">旋转</button></div><div id="targets"></div><details class="quote-wrap" hidden><summary>证据摘录</summary><p id="evidence-quote"></p></details><div id="pdf-scroll"><div id="pdf-stage"></div></div><p id="source-caution"></p></section>
 </div>
</div><div id="global-save-status" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true" data-state="idle"></div></body></html>
