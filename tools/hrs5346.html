/* Responsive evidence-workbench refactor v2. */
:root{
  --srs-radius-lg:18px;
  --srs-shadow-card:0 8px 24px #17384b12;
}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-padding-top:76px;
}
.app-shell{grid-template-columns:252px minmax(0,1fr)}
.app-shell-collapsed{grid-template-columns:76px minmax(0,1fr)}
.sidebar{padding:16px 12px 14px}
.brand{min-height:68px;padding:7px 7px 15px}
.primary-navigation{margin-top:14px}
.nav-item{min-height:40px;padding:8px 9px}
.page{
  min-width:0;
  width:min(1540px,100%);
  padding:32px clamp(28px,3vw,48px) 44px;
}
.module-header{
  min-height:0;
  border-radius:18px;
  padding:28px clamp(28px,3vw,38px);
}
.module-header:before{width:6px}
.module-header:after{width:26%;opacity:.62}
.module-header h1{
  max-width:1040px;
  margin:8px 0 10px;
  font-size:clamp(1.7rem,2.55vw,2.35rem);
  line-height:1.18;
}
.module-header p{
  max-width:1040px;
  font-size:.9rem;
  line-height:1.65;
}
#roadmap .module-header h1{font-size:clamp(1.65rem,2.35vw,2.2rem)}
.section{
  min-width:0;
  border-radius:16px;
  margin-top:18px;
  padding:clamp(20px,2.2vw,28px);
}
.section-heading{gap:14px;margin-bottom:17px}
.section-heading h2{font-size:clamp(1.2rem,1.7vw,1.55rem)}
.section-heading p{margin-top:6px;font-size:.82rem;line-height:1.55}
.detail-grid{gap:9px}
.detail-grid>div{padding:11px}
.question-list{gap:12px}
.question-list>article{border-radius:13px;padding:18px}
.question-list h3{margin:12px 0;font-size:1.02rem;line-height:1.5}
.current-answer{border-left-width:4px;margin-top:10px;padding:15px}
.current-answer p{margin-top:5px;font-size:.92rem;line-height:1.6}
.progressive-detail{margin-top:12px}
.progressive-detail summary{padding-top:12px}
.need-type-stack{gap:16px;margin-top:18px}
.need-type-stack>.section{margin-top:0}
.card-grid,.action-card-grid{gap:11px}
.entity-card{border-radius:12px;padding:16px}
.entity-card h3,.action-card h3{margin:10px 0 7px;font-size:.96rem;line-height:1.45}
.entity-card>p,.action-card>button>p{font-size:.8rem;line-height:1.55}
.action-card{border-radius:12px}
.action-card>button{padding:12px}
.action-card dl{gap:6px}
.action-card dl div{padding:8px}
.drawer-layer{grid-template-columns:1fr minmax(380px,600px)}
.drawer-header{padding:18px 20px}
.drawer-content{gap:15px;padding:20px}
.map-preset-selector{margin-top:13px}
.map-context{align-items:center;margin:13px 0 9px}
.map-context p{font-size:.73rem;line-height:1.55}
.table-scroll{
  width:100%;
  border:1px solid var(--srs-line);
  border-radius:13px;
  background:#fbfcfd;
  padding:5px;
  overflow-x:auto;
  overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:#9bb9ca #edf3f6;
}
.table-scroll::-webkit-scrollbar{height:9px}
.table-scroll::-webkit-scrollbar-track{background:#edf3f6;border-radius:999px}
.table-scroll::-webkit-scrollbar-thumb{background:#9bb9ca;border-radius:999px}
.evidence-map-section .evidence-matrix{
  min-width:1040px;
  border-spacing:5px;
}
.evidence-map-section .evidence-matrix thead th:first-child,
.evidence-map-section .evidence-matrix tbody th{
  box-sizing:border-box;
  width:280px;
  min-width:280px;
  max-width:280px;
  position:static;
  left:auto;
}
.evidence-map-section .evidence-matrix thead th:first-child{
  text-align:left;
  vertical-align:middle;
  padding-left:12px;
}
.evidence-map-section .evidence-matrix tbody th{
  z-index:auto;
  padding:10px 12px;
  overflow-wrap:anywhere;
  font-size:.67rem;
  line-height:1.42;
  box-shadow:none;
}
.evidence-map-section .evidence-matrix tbody th small{font-size:.54rem}
.evidence-map-section .evidence-matrix thead th:not(:first-child){
  width:90px;
  min-width:90px;
  height:68px;
}
.evidence-map-section .evidence-count-matrix td{height:48px}
.evidence-map-section .matrix-count-empty{min-width:50px;height:42px}
.evidence-map-section .matrix-count-button{min-width:50px;min-height:42px}
.priority-workspace{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px}
.priority-chart-area{min-width:0;overflow-x:auto;overflow-y:hidden}
.priority-chart-shell{grid-template-rows:470px 46px}
.priority-plot{min-height:470px}
.priority-action-list>div{max-height:500px}
.priority-selected-detail{margin-top:14px;padding:16px}
.selected-score-grid{gap:8px}
.selected-score-grid article{padding:11px}
.roadmap-v11{gap:11px;margin-top:18px}
.roadmap-lane{border-radius:14px;grid-template-columns:220px minmax(0,1fr)}
.roadmap-lane>header{padding:18px}
.roadmap-lane-body{gap:12px;padding:15px}
.roadmap-work-items{gap:7px}
.roadmap-work-items>article{padding:9px}
.roadmap-conditions>div{padding:10px}
@media (min-width:1540px){
  .card-grid,.action-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (width<=1180px){
  .app-shell{grid-template-columns:228px minmax(0,1fr)}
  .priority-workspace{grid-template-columns:1fr}
  .priority-chart-area{overflow-x:auto}
  .priority-action-list>div{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-height:350px;display:grid}
}
@media (width<=960px){
  .app-shell,.app-shell-collapsed{padding-bottom:calc(68px + env(safe-area-inset-bottom));display:block}
  .compact-header{min-height:60px;padding:8px 14px}
  .compact-header>button{width:38px;height:38px}
  .page{padding:22px clamp(18px,3.5vw,30px) 34px}
  .module-header{padding:25px 26px}
  .section{padding:20px}
  .evidence-map-section .evidence-matrix thead th:first-child,
  .evidence-map-section .evidence-matrix tbody th{width:240px;min-width:240px;max-width:240px}
  .roadmap-lane{grid-template-columns:1fr}
  .roadmap-lane>header{align-items:center}
}
@media (width<=720px){
  .compact-header{gap:10px;min-height:58px;padding:7px 12px}
  .compact-header strong{font-size:.9rem}
  .compact-header span,.compact-header small{font-size:.62rem}
  .page{padding:13px 12px 24px}
  .module-header{border-radius:14px;padding:20px 18px}
  .module-header:after{width:20%;opacity:.42}
  .module-header h1{margin:6px 0 9px;font-size:clamp(1.45rem,7vw,1.85rem)}
  .module-header p{font-size:.82rem;line-height:1.55}
  #roadmap .module-header h1{font-size:clamp(1.4rem,6.5vw,1.75rem)}
  .section{border-radius:13px;margin-top:12px;padding:15px}
  .section-heading{gap:9px;margin-bottom:13px}
  .section-heading h2{font-size:1.12rem}
  .section-heading p{font-size:.76rem}
  .question-list{gap:9px}
  .question-list>article{border-radius:11px;padding:14px}
  .question-list article>header{display:grid}
  .question-list h3{margin:10px 0;font-size:.94rem}
  .current-answer{padding:12px}
  .current-answer p{font-size:.84rem;line-height:1.55}
  .detail-grid{grid-template-columns:1fr}
  .card-grid,.action-card-grid{grid-template-columns:1fr}
  .entity-card{padding:14px}
  .action-card>button{padding:10px}
  .drawer-header{padding:14px 15px}
  .drawer-content{padding:15px}
  .map-preset-selector{scroll-snap-type:x proximity;gap:4px;padding:4px}
  .map-preset-selector button{flex-basis:156px;scroll-snap-align:start;padding:6px 8px}
  .map-context{align-items:start;gap:7px;margin:11px 0 8px}
  .map-context>span{font-size:.62rem}
  .table-scroll{border-radius:11px;padding:3px}
  .evidence-map-section .evidence-matrix{min-width:760px;border-spacing:4px}
  .evidence-map-section .evidence-matrix thead th:first-child,
  .evidence-map-section .evidence-matrix tbody th{width:190px;min-width:190px;max-width:190px}
  .evidence-map-section .evidence-matrix tbody th{padding:8px 9px;font-size:.62rem}
  .evidence-map-section .evidence-matrix tbody th small{font-size:.5rem}
  .evidence-map-section .evidence-matrix thead th:not(:first-child){width:76px;min-width:76px;height:62px;font-size:.61rem}
  .evidence-map-section .evidence-count-matrix td{height:44px}
  .priority-chart-area{overflow-x:auto;padding-bottom:5px}
  .priority-chart-shell{min-width:560px;grid-template-rows:410px 44px}
  .priority-plot{min-height:410px}
  .priority-legend{min-width:516px}
  .priority-action-list>div{max-height:330px;display:block}
  .priority-selected-detail{padding:13px}
  .roadmap-lane>header{padding:15px}
  .roadmap-lane-body{padding:12px}
  .roadmap-work-items{grid-template-columns:1fr}
  .mobile-navigation{padding-top:5px;gap:2px}
  .mobile-navigation .nav-item{min-height:48px;padding:4px 2px;font-size:.68rem}
}
@media (width<=420px){
  .compact-header{padding-inline:10px}
  .page{padding:10px 9px 20px}
  .module-header{padding:18px 16px}
  .module-header h1{font-size:1.4rem}
  .section{padding:13px}
  .section-heading h2{font-size:1.05rem}
  .evidence-map-section .evidence-matrix{min-width:720px}
  .evidence-map-section .evidence-matrix thead th:first-child,
  .evidence-map-section .evidence-matrix tbody th{width:174px;min-width:174px;max-width:174px}
  .evidence-map-section .evidence-matrix thead th:not(:first-child){width:72px;min-width:72px}
  .priority-chart-shell{min-width:520px}
  .priority-legend{min-width:486px}
}
</style>
  </head>
