<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业选择与排序</title>
<style>
:root {
  --primary:#0f766e;
  --primary-dark:#115e59;
  --soft:#ecfdf5;
  --border:#d9e7e4;
  --text:#1f2937;
  --muted:#64748b;
  --bg:#f6f9f8;
  --card:#ffffff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
}
main {
  width:min(760px,calc(100% - 20px));
  margin:0 auto;
  padding:18px 0 36px;
}
h1 {
  margin:0;
  font-size:24px;
  color:var(--primary-dark);
}
.tip {
  margin:7px 0 15px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}
#list {
  display:flex;
  flex-direction:column;
  gap:8px;
}
.item {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(15,118,110,.06);
}
.item.drag-ready {
  border-color:#5fb6aa;
  box-shadow:0 0 0 3px rgba(15,118,110,.12), 0 10px 24px rgba(15,118,110,.14);
}
.item.dragging {
  opacity:.82;
  border-color:#0f766e;
  box-shadow:0 0 0 3px rgba(15,118,110,.16), 0 14px 30px rgba(15,118,110,.24);
  transform:scale(1.012);
  z-index:50;
}
.item-main {
  display:grid;
  grid-template-columns:32px 42px minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:6px;
  min-height:58px;
  padding:8px 8px 8px 10px;
  user-select:none;
  -webkit-user-select:none;
}
.drag-zone {
  min-width:0;
  cursor:grab;
  touch-action:pan-y;
  border-radius:8px;
  padding:4px 2px;
}
.drag-zone:active {
  cursor:grabbing;
}
.item.drag-ready .drag-zone {
  background:rgba(15,118,110,.07);
}
.select-box {
  width:20px;
  height:20px;
  accent-color:var(--primary);
  cursor:pointer;
}
.rank {
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--soft);
  color:var(--primary-dark);
  font-weight:750;
}
.item.excluded {
  opacity:.58;
  background:#f3f4f6;
}
.item.excluded .name {
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.item.excluded .rank {
  background:#e5e7eb;
  color:#6b7280;
}
.status-text {
  margin-left:6px;
  color:#9a3412;
  font-weight:600;
}
.name {
  font-size:16px;
  font-weight:700;
  line-height:1.35;
}
.school-count {
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}
.icon-btn {
  width:34px;
  height:34px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  color:var(--primary-dark);
  font-size:16px;
  cursor:pointer;
  touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:hover { border-color:var(--primary); }
.details {
  display:none;
  padding:4px 12px 12px;
  border-top:1px solid var(--border);
  background:#fbfdfc;
}
.item.open .details { display:block; }
.school {
  padding:9px 0;
  border-bottom:1px dashed #dce7e5;
}
.school:last-child { border-bottom:none; }
.school-name {
  font-size:14px;
  font-weight:700;
}
.school-meta {
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.toast {
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(12px);
  opacity:0;
  background:#0f172a;
  color:#fff;
  border-radius:9px;
  padding:9px 13px;
  font-size:13px;
  pointer-events:none;
  transition:.18s;
  z-index:100;
}
.toast.show {
  opacity:.94;
  transform:translateX(-50%) translateY(0);
}
@media(max-width:560px) {
  main { width:calc(100% - 14px); padding-top:13px; }
  h1 { font-size:21px; }
  .item-main {
    grid-template-columns:28px 36px minmax(0,1fr) 44px;
    min-height:58px;
    padding:7px 7px;
    gap:5px;
  }
  .rank { width:32px; height:32px; }
  .icon-btn.up,
  .icon-btn.down {
    display:none;
  }
  .icon-btn.expand {
    width:44px;
    height:44px;
    font-size:20px;
    border-radius:11px;
    touch-action:pan-y;
  }
  .name { font-size:15px; }
}
</style>
</head>

const toast = document.getElementById("toast");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function money(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n.toLocaleString("zh-CN")+"元/年" : "-";
}
function loadItems() {
  try {
    const order = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!Array.isArray(order)) return ITEMS.slice();
    const byName = new Map(ITEMS.map(x => [x.name,x]));
    const result = order.map(n => byName.get(n)).filter(Boolean);
    ITEMS.forEach(x => { if (!order.includes(x.name)) result.push(x); });
    return result;
  } catch(e) {
    return ITEMS.slice();
  }
}
function loadSelection() {
  try {
    const saved = JSON.parse(localStorage.getItem(SELECT_KEY) || "{}");
    return saved && typeof saved === "object" ? saved : {};
  } catch(e) {
    return {};
  }
}
let selectedState = loadSelection();

function isSelected(name) {
  return selectedState[name] !== false;
}
function saveSelection() {
  localStorage.setItem(SELECT_KEY, JSON.stringify(selectedState));
}

function saveOrder() {
  const order = [...list.querySelectorAll(".item")].map(x => x.dataset.name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove("show"), 1300);
}
function schoolHTML(o) {
  return `
    <div class="school">
      <div class="school-name">${esc(o.school)}</div>
      <div class="school-meta">
        专业组 ${esc(o.group_code)} · 专业代码 ${esc(o.profession_code)} ·
        学费 ${money(o.tuition)} · 计划 ${esc(o.plan)} 人<br>
        ${esc(o.raw_name)}
      </div>
    </div>`;
}
function render() {
  const ordered = loadItems().sort((a,b) => Number(isSelected(b.name)) - Number(isSelected(a.name)));
  list.innerHTML = ordered.map((item,i) => `
    <section class="item ${isSelected(item.name) ? "" : "excluded"}" data-name="${esc(item.name)}">
      <div class="item-main">
        <input class="select-box" type="checkbox" ${isSelected(item.name) ? "checked" : ""} aria-label="是否考虑">
        <div class="rank">${i+1}</div>
        <div class="drag-zone" title="长按拖动专业">
          <div class="name">${esc(item.name)}${isSelected(item.name) ? "" : '<span class="status-text">不考虑</span>'}</div>
          <div class="school-count">${item.options.length} 个学校/专业项</div>
        </div>
        <button class="icon-btn up" type="button" title="上移">↑</button>
        <button class="icon-btn down" type="button" title="下移">↓</button>
        <button class="icon-btn expand" type="button" title="查看学校">⌄</button>
      </div>
      <div class="details">
        ${item.options.map(schoolHTML).join("")}
      </div>
    </section>
  `).join("");
  bindEvents();
  updateRanks();
}
function updateRanks() {
  let selectedRank = 0;
  [...list.querySelectorAll(".item")].forEach(el => {
    const checked = el.querySelector(".select-box").checked;
    el.querySelector(".rank").textContent = checked ? ++selectedRank : "×";
  });
}
function sameGroup(a,b) {
  return a && b && a.querySelector(".select-box").checked === b.querySelector(".select-box").checked;
}
function moveUp(item) {
  const prev = item.previousElementSibling;
  if (!sameGroup(item, prev)) return;
  list.insertBefore(item, prev);
  updateRanks();
  saveOrder();
  showToast("已上移");
}
function moveDown(item) {
  const next = item.nextElementSibling;
  if (!sameGroup(item, next)) return;
  list.insertBefore(next, item);
  updateRanks();
  saveOrder();
  showToast("已下移");
}
function placeBySelection(item, checked) {
  if (checked) {
    const firstExcluded = [...list.querySelectorAll(".item")].find(el => !el.querySelector(".select-box").checked && el !== item);
    if (firstExcluded) list.insertBefore(item, firstExcluded);
    else list.appendChild(item);
  } else {
    list.appendChild(item);
  }
  item.classList.toggle("excluded", !checked);
  const nameEl = item.querySelector(".name");
  const baseName = item.dataset.name;
  nameEl.innerHTML = checked ? esc(baseName) : esc(baseName) + '<span class="status-text">不考虑</span>';
  updateRanks();
  saveOrder();
}
function bindEvents() {
  list.querySelectorAll(".select-box").forEach(box => {
    box.addEventListener("click", e => e.stopPropagation());
    box.addEventListener("change", () => {
      const item = box.closest(".item");
      selectedState[item.dataset.name] = box.checked;
      saveSelection();
      placeBySelection(item, box.checked);
      showToast(box.checked ? "已恢复考虑" : "已移至不考虑");
    });
  });
  list.querySelectorAll(".up").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      moveUp(btn.closest(".item"));
    });
  });
  list.querySelectorAll(".down").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      moveDown(btn.closest(".item"));
    });
  });
  list.querySelectorAll(".expand").forEach(btn => {
    let startX = 0;
    let startY = 0;
    let startTime = 0;
    let moved = false;
    let activePointer = null;

    btn.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      startX = e.clientX;
      startY = e.clientY;
      startTime = Date.now();
      moved = false;
      activePointer = e.pointerId;
    });

    btn.addEventListener("pointermove", e => {
      if (activePointer !== e.pointerId) return;
      if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
        moved = true;
      }
    });

    btn.addEventListener("pointerup", e => {
      if (activePointer !== e.pointerId) return;
      const elapsed = Date.now() - startTime;
      activePointer = null;

      // Only a deliberate tap toggles details. A vertical swipe remains page scrolling.
      if (moved || elapsed > 700) return;

      e.stopPropagation();
      const item = btn.closest(".item");
      item.classList.toggle("open");
      btn.textContent = item.classList.contains("open") ? "⌃" : "⌄";
    });

    btn.addEventListener("pointercancel", () => {
      activePointer = null;
      moved = false;
    });

    // Prevent the browser-generated click from toggling a second time.
    btn.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
    });
  });
  bindDrag();
}
function bindDrag() {
  const HOLD_MS = 350;
  const CANCEL_DISTANCE = 10;

  list.querySelectorAll(".drag-zone").forEach(zone => {
    let item = null;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let activated = false;
    let holdTimer = null;
    let activeRow = null;

    const clearHold = () => {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      if (item && !activated) item.classList.remove("drag-ready");
    };

    zone.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;

      item = row.closest(".item");
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      activated = false;
      activeRow = zone;

      holdTimer = setTimeout(() => {
        activated = true;
        item.classList.add("drag-ready", "dragging");
        zone.setPointerCapture(pointerId);
        document.body.style.userSelect = "none";
        zone.style.touchAction = "none";
        if (navigator.vibrate) navigator.vibrate(25);
      }, HOLD_MS);
    });

    zone.addEventListener("pointermove", e => {
      if (!item || e.pointerId !== pointerId) return;

      const dx = Math.abs(e.clientX - startX);
      const dy = Math.abs(e.clientY - startY);

      if (!activated) {
        if (dx > CANCEL_DISTANCE || dy > CANCEL_DISTANCE) {
          clearHold();
          item = null;
          pointerId = null;
          activeRow = null;
        }
        return;
      }

      if (e.clientY < 70) window.scrollBy(0, -18);
      if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 18);

      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit ? hit.closest(".item") : null;
      if (!target || target === item || !sameGroup(item, target)) {
        e.preventDefault();
        return;
      }

      const rect = target.getBoundingClientRect();
      list.insertBefore(item, e.clientY < rect.top + rect.height / 2 ? target : target.nextSibling);
      e.preventDefault();
    }, { passive:false });

    const finish = e => {
      if (!item || e.pointerId !== pointerId) return;

      clearHold();

      if (activated) {
        item.classList.remove("drag-ready", "dragging");
        try {
          if (activeRow && activeRow.hasPointerCapture(pointerId)) {
            activeRow.releasePointerCapture(pointerId);
          }
        } catch(err) {}
        zone.style.touchAction = "pan-y";
        document.body.style.userSelect = "";
        updateRanks();
        saveOrder();
        showToast("排序已保存");
      }

      item = null;
      pointerId = null;
      activeRow = null;
      activated = false;
    };

    zone.addEventListener("pointerup", finish);
    zone.addEventListener("pointercancel", finish);
    zone.addEventListener("lostpointercapture", e => {
      if (activated && item) {
        item.classList.remove("drag-ready", "dragging");
        zone.style.touchAction = "pan-y";
        document.body.style.userSelect = "";
      }
      clearHold();
      item = null;
      pointerId = null;
      activeRow = null;
      activated = false;
    });
  });
}
render();
</script>
</body>
</html>
