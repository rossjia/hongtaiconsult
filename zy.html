<title>专业排序</title>
<style>
:root {
  --primary:#0f766e;
  --primary-dark:#115e59;
  --soft:#ecfdf5;
  --border:#d9e7e4;
  --text:#1f2937;
  --muted:#64748b;
  --bg:#f6f9f8;
  --card:#ffffff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
}
main {
  width:min(760px,calc(100% - 20px));
  margin:0 auto;
  padding:18px 0 36px;
}
h1 {
  margin:0;
  font-size:24px;
  color:var(--primary-dark);
}
.tip {
  margin:7px 0 15px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}
#list {
  display:flex;
  flex-direction:column;
  gap:8px;
}
.item {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(15,118,110,.06);
}
.item.dragging {
  opacity:.78;
  box-shadow:0 12px 28px rgba(15,118,110,.20);
  transform:scale(1.01);
  z-index:50;
}
.item-main {
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:6px;
  min-height:58px;
  padding:8px 8px 8px 10px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.item-main:active { cursor:grabbing; }
.rank {
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--soft);
  color:var(--primary-dark);
  font-weight:750;
}
.name {
  font-size:16px;
  font-weight:700;
  line-height:1.35;
}
.school-count {
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}
.icon-btn {
  width:34px;
  height:34px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  color:var(--primary-dark);
  font-size:16px;
  cursor:pointer;
  touch-action:manipulation;
}
.icon-btn:hover { border-color:var(--primary); }
.details {
  display:none;
  padding:4px 12px 12px;
  border-top:1px solid var(--border);
  background:#fbfdfc;
}
.item.open .details { display:block; }
.school {
  padding:9px 0;
  border-bottom:1px dashed #dce7e5;
}
.school:last-child { border-bottom:none; }
.school-name {
  font-size:14px;
  font-weight:700;
}
.school-meta {
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.toast {
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(12px);
  opacity:0;
  background:#0f172a;
  color:#fff;
  border-radius:9px;
  padding:9px 13px;
  font-size:13px;
  pointer-events:none;
  transition:.18s;
  z-index:100;
}
.toast.show {
  opacity:.94;
  transform:translateX(-50%) translateY(0);
}
@media(max-width:560px) {
  main { width:calc(100% - 14px); padding-top:13px; }
  h1 { font-size:21px; }
  .item-main {
    grid-template-columns:38px minmax(0,1fr) 32px 32px 32px;
    min-height:55px;
    padding-left:7px;
    gap:4px;
  }
  .rank { width:32px; height:32px; }
  .icon-btn { width:31px; height:31px; }
  .name { font-size:15px; }
}
</style>
</head>

const STORAGE_KEY = "major-sort-20260801-simple-v1";
const list = document.getElementById("list");
const toast = document.getElementById("toast");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function money(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n.toLocaleString("zh-CN")+"元/年" : "-";
}
function loadItems() {
  try {
    const order = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!Array.isArray(order)) return ITEMS.slice();
    const byName = new Map(ITEMS.map(x => [x.name,x]));
    const result = order.map(n => byName.get(n)).filter(Boolean);
    ITEMS.forEach(x => { if (!order.includes(x.name)) result.push(x); });
    return result;
  } catch(e) {
    return ITEMS.slice();
  }
}
function saveOrder() {
  const order = [...list.querySelectorAll(".item")].map(x => x.dataset.name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove("show"), 1300);
}

      <div class="school-name">${esc(o.school)}</div>
      <div class="school-meta">
        专业组 ${esc(o.group_code)} · 专业代码 ${esc(o.profession_code)} ·
        学费 ${money(o.tuition)} · 计划 ${esc(o.plan)} 人<br>
        ${esc(o.raw_name)}
      </div>
    </div>`;
}
function render() {
  list.innerHTML = loadItems().map((item,i) => `
    <section class="item" data-name="${esc(item.name)}">
      <div class="item-main">
        <div class="rank">${i+1}</div>
        <div>
          <div class="name">${esc(item.name)}</div>
          <div class="school-count">${item.options.length} 个学校/专业项</div>
        </div>
        <button class="icon-btn up" type="button" title="上移">↑</button>
        <button class="icon-btn down" type="button" title="下移">↓</button>
        <button class="icon-btn expand" type="button" title="查看学校">⌄</button>
      </div>
      <div class="details">
        ${item.options.map(schoolHTML).join("")}
      </div>
    </section>
  `).join("");
  bindEvents();
  updateRanks();
}
function updateRanks() {
  [...list.querySelectorAll(".item")].forEach((el,i) => {
    el.querySelector(".rank").textContent = i+1;
  });
}
function moveUp(item) {
  const prev = item.previousElementSibling;
  if (!prev) return;
  list.insertBefore(item, prev);
  updateRanks();
  saveOrder();
  showToast("已上移");
}
function moveDown(item) {
  const next = item.nextElementSibling;
  if (!next) return;
  list.insertBefore(next, item);
  updateRanks();
  saveOrder();
  showToast("已下移");
}
function bindEvents() {
  list.querySelectorAll(".up").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      moveUp(btn.closest(".item"));
    });
  });
  list.querySelectorAll(".down").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      moveDown(btn.closest(".item"));
    });
  });
  list.querySelectorAll(".expand").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const item = btn.closest(".item");
      item.classList.toggle("open");
      btn.textContent = item.classList.contains("open") ? "⌃" : "⌄";
    });
  });
  bindDrag();
}
function bindDrag() {
  let dragging = null;
  let pointerId = null;
  let startY = 0;
  let moved = false;

  list.querySelectorAll(".item-main").forEach(row => {
    row.addEventListener("pointerdown", e => {
      if (e.target.closest("button")) return;
      if (e.button !== undefined && e.button !== 0) return;
      dragging = row.closest(".item");
      pointerId = e.pointerId;
      startY = e.clientY;
      moved = false;
      row.setPointerCapture(pointerId);
      dragging.classList.add("dragging");
      document.body.style.userSelect = "none";
      e.preventDefault();
    });

    row.addEventListener("pointermove", e => {
      if (!dragging || e.pointerId !== pointerId) return;
      if (Math.abs(e.clientY - startY) > 4) moved = true;

      if (e.clientY < 70) window.scrollBy(0,-18);
      if (e.clientY > window.innerHeight-60) window.scrollBy(0,18);

      const hit = document.elementFromPoint(e.clientX,e.clientY);
      const target = hit ? hit.closest(".item") : null;
      if (!target || target === dragging) return;

      const rect = target.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height/2;
      list.insertBefore(dragging, before ? target : target.nextSibling);
      e.preventDefault();
    });

    const end = e => {
      if (!dragging || e.pointerId !== pointerId) return;
      dragging.classList.remove("dragging");
      try { row.releasePointerCapture(pointerId); } catch(err) {}
      dragging = null;
      pointerId = null;
      document.body.style.userSelect = "";
      updateRanks();
      saveOrder();
      if (moved) showToast("排序已保存");
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
  });
}
render();
</script>
</body>
</html>
