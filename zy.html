<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业兴趣拖动排序</title>
<style>
:root {
  --primary: #0f766e;
  --primary-dark: #115e59;
  --soft: #ecfdf5;
  --border: #d9e7e4;
  --text: #1f2937;
  --muted: #64748b;
  --bg: #f7faf9;
  --card: #ffffff;
  --shadow: 0 8px 24px rgba(15, 118, 110, .08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
               "PingFang SC", Arial, sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(247,250,249,.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner, main {
  width: min(920px, calc(100% - 24px));
  margin: 0 auto;
}
.header-inner { padding: 16px 0 13px; }
h1 {
  margin: 0;
  font-size: clamp(22px, 5vw, 32px);
  color: var(--primary-dark);
}
.subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  line-height: 1.55;
  font-size: 14px;
}
.warning {
  margin-top: 10px;
  padding: 10px 12px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 10px;
  color: #9a3412;
  font-size: 13px;
  line-height: 1.5;
}
.toolbar {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto;
  gap: 10px;
  margin-top: 12px;
}
.search {
  width: 100%;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;
  outline: none;
}
.search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.10); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button, select {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  cursor: pointer;
}
button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
button:hover { border-color: var(--primary); }
main { padding: 16px 0 44px; }
.summary {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin: 2px 2px 12px;
  color: var(--muted);
  font-size: 13px;
}
.category-tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: thin;
}
.category-tabs button {
  white-space: nowrap;
  padding: 7px 11px;
  border-radius: 999px;
}
.category-tabs button.active {
  background: var(--soft);
  border-color: #99d7ce;
  color: var(--primary-dark);
  font-weight: 600;
}
#list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.item.dragging {
  opacity: .72;
  transform: scale(1.015);
  box-shadow: 0 14px 35px rgba(15,118,110,.20);
  z-index: 99;
}
.item.hidden { display: none; }
.item-main {
  display: grid;
  grid-template-columns: 46px 36px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 11px 12px;
}
.rank {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--soft);
  color: var(--primary-dark);
  font-weight: 750;
  font-size: 15px;
}
.drag-handle {
  touch-action: none;
  user-select: none;
  cursor: grab;
  width: 34px;
  height: 38px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #76908b;
  font-size: 21px;
}
.drag-handle:active { cursor: grabbing; background: #eef6f4; }
.profession-name {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.35;
}
.meta {
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
}
.badge {
  display: inline-block;
  background: #f1f5f4;
  border: 1px solid #dbe7e4;
  border-radius: 999px;
  padding: 2px 7px;
  color: #49645f;
}
.expand {
  padding: 8px 10px;
  min-width: 42px;
  color: var(--primary);
  border: none;
  background: transparent;
  font-size: 18px;
}
.details {
  display: none;
  border-top: 1px solid var(--border);
  background: #fbfdfc;
  padding: 10px 12px 12px 94px;
}
.item.open .details { display: block; }
.school-option {
  padding: 9px 0;
  border-bottom: 1px dashed #dce7e5;
  line-height: 1.5;
  font-size: 13px;
}
.school-option:last-child { border-bottom: none; }
.school-name { font-weight: 700; color: #334155; }
.school-detail { color: var(--muted); margin-top: 3px; }
.note-input {
  width: 100%;
  margin-top: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
  font-size: 13px;
  font-family: inherit;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  background: #0f172a;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  transition: .2s;
  z-index: 200;
  font-size: 14px;
}
.toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }
.empty {
  display: none;
  padding: 35px 12px;
  text-align: center;
  color: var(--muted);
}
footer {
  width: min(920px, calc(100% - 24px));
  margin: 0 auto 30px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}
@media (max-width: 650px) {
  .toolbar { grid-template-columns: 1fr; }
  .actions { justify-content: stretch; }
  .actions button, .actions select { flex: 1 1 auto; }
  .item-main { grid-template-columns: 42px 32px minmax(0, 1fr) 36px; padding: 10px 8px; gap: 5px; }
  .rank { width: 35px; height: 35px; }
  .details { padding-left: 12px; }
  .profession-name { font-size: 15px; }
}
@media print {
  header { position: static; }
  .toolbar, .category-tabs, .drag-handle, .expand, .note-input, .warning { display:none !important; }
  .item { box-shadow:none; break-inside:avoid; }
  .details { display:block !important; padding-left:12px; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>专业兴趣拖动排序</h1>
    <p class="subtitle">按自己的兴趣和接受程度，从最想学排到最不想学。电脑可拖动左侧手柄，手机也可按住手柄上下移动。</p>
    <div class="warning">这里只排序“专业兴趣”，不等于最终志愿顺序。学校、录取概率、专业组调剂、校区和身体条件需要之后另行判断。</div>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="搜索专业或学校名称">
      <div class="actions">
        <button id="expandAll">全部展开</button>
        <button id="copyBtn">复制排序</button>
        <button id="downloadBtn" class="primary">下载排序TXT</button>
        <button id="resetBtn">恢复初始</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="summary">
    <span>共 <strong id="totalCount">30</strong> 个专业</span>
    <span>排序会自动保存在本浏览器</span>
  </div>
  <div class="category-tabs" id="categoryTabs"></div>
  <div id="list"></div>
  <div id="empty" class="empty">没有找到匹配的专业。</div>
</main>

<footer>

</footer>

re24": "363/75276", "tuition": 17000, "plan": 20}, {"school": "武汉城市学院", "group_code": "C212(04)", "profession_code": "62", "raw_name": "新能源汽车技术 (第一年红安教育改革基地，第二年回武汉主校区)", "score25": "-/-", "score24": "288/107919", "tuition": 9000, "plan": 110}, {"school": "湖北开放职业学院", "group_code": "C601(01)", "profession_code": "11", "raw_name": "新能源汽车技术", "score25": "-/-", "score24": "347/82851", "tuition": 11880, "plan": 20}]}, {"name": "药品生物技术", "category": "理工技术", "options": [{"school": "湖北工业职业技术学院 中外合作办学", "group_code": "C506(08)", "profession_code": "44", "raw_name": "药品生物技术 (中外合作办学)(与白俄罗斯莫吉廖夫国立大学合作办学)", "score25": "203/136151", "score24": "-/-", "tuition": 15000, "plan": 15}]}];
const STORAGE_KEY = "major-sort-20260801-v1";
const NOTE_KEY = "major-sort-notes-20260801-v1";
let currentCategory = "全部";
let expandedAll = false;

const list = document.getElementById("list");
const searchInput = document.getElementById("search");
const toast = document.getElementById("toast");
const empty = document.getElementById("empty");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function money(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n.toLocaleString("zh-CN") + "元/年" : "-";
}
function loadOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!Array.isArray(saved)) return SOURCE_ITEMS;
    const byName = new Map(SOURCE_ITEMS.map(x => [x.name, x]));
    const ordered = saved.map(n => byName.get(n)).filter(Boolean);
    SOURCE_ITEMS.forEach(x => { if (!saved.includes(x.name)) ordered.push(x); });
    return ordered;
  } catch (e) { return SOURCE_ITEMS; }
}
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTE_KEY) || "{}"); }
  catch (e) { return {}; }
}
let notes = loadNotes();

function itemHTML(item) {
  const optionHtml = item.options.map(o => `
    <div class="school-option">
      <div class="school-name">${esc(o.school)}</div>
      <div class="school-detail">
        专业组 ${esc(o.group_code)} · 专业代码 ${esc(o.profession_code)} ·
        学费 ${money(o.tuition)} · 招生 ${esc(o.plan)} 人<br>
        原表名称：${esc(o.raw_name)}<br>
        2025：${esc(o.score25)}；2024：${esc(o.score24)}
      </div>
    </div>`).join("");
  return `
    <div class="item" data-name="${esc(item.name)}" data-category="${esc(item.category)}" draggable="true">
      <div class="item-main">
        <div class="rank"></div>
        <div class="drag-handle" title="拖动排序" aria-label="拖动排序">☷</div>
        <div>
          <div class="profession-name">${esc(item.name)}</div>
          <div class="meta">
            <span class="badge">${esc(item.category)}</span>
            <span>${item.options.length} 所/项院校选择</span>
          </div>
        </div>
        <button class="expand" aria-label="展开详情">⌄</button>
      </div>
      <div class="details">
        ${optionHtml}
        <input class="note-input" type="text" placeholder="可填写个人备注，例如：喜欢、可以接受、不考虑"
               value="${esc(notes[item.name] || "")}">
      </div>
    </div>`;
}
function render() {
  list.innerHTML = loadOrder().map(itemHTML).join("");
  bindEvents();
  updateRanks();
  applyFilter();
}
function updateRanks() {
  [...list.querySelectorAll(".item")].forEach((el, i) => {
    el.querySelector(".rank").textContent = i + 1;
  });
}
function saveOrder() {
  const order = [...list.querySelectorAll(".item")].map(el => el.dataset.name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove("show"), 1800);
}
function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  let visible = 0;
  [...list.querySelectorAll(".item")].forEach(el => {
    const item = SOURCE_ITEMS.find(x => x.name === el.dataset.name);
    const haystack = (item.name + " " + item.options.map(o => o.school + " " + o.raw_name).join(" ")).toLowerCase();
    const okCategory = currentCategory === "全部" || item.category === currentCategory;
    const okSearch = !q || haystack.includes(q);
    el.classList.toggle("hidden", !(okCategory && okSearch));
    if (okCategory && okSearch) visible++;
  });
  empty.style.display = visible ? "none" : "block";
}
function categoryButtons() {
  const categories = ["全部", ...new Set(SOURCE_ITEMS.map(x => x.category))];
  const box = document.getElementById("categoryTabs");
  box.innerHTML = categories.map(c => `<button data-cat="${esc(c)}" class="${c==="全部"?"active":""}">${esc(c)}</button>`).join("");
  box.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    currentCategory = btn.dataset.cat;
    box.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
    applyFilter();
  });
}

function bindEvents() {
  list.querySelectorAll(".expand").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = btn.closest(".item");
      item.classList.toggle("open");
      btn.textContent = item.classList.contains("open") ? "⌃" : "⌄";
    });
  });
  list.querySelectorAll(".note-input").forEach(input => {
    input.addEventListener("input", () => {
      const name = input.closest(".item").dataset.name;
      notes[name] = input.value;
      localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
    });
  });
  bindDesktopDrag();
  bindPointerDrag();
}

function bindDesktopDrag() {
  let dragging = null;
  list.querySelectorAll(".item").forEach(item => {
    item.addEventListener("dragstart", e => {
      if (!e.target.closest(".drag-handle")) {
        e.preventDefault();
        return;
      }
      dragging = item;
      item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    item.addEventListener("dragend", () => {
      if (dragging) dragging.classList.remove("dragging");
      dragging = null;
      updateRanks(); saveOrder(); showToast("排序已保存");
    });
  });
  list.addEventListener("dragover", e => {
    if (!dragging) return;
    e.preventDefault();
    const target = e.target.closest(".item");
    if (!target || target === dragging || target.classList.contains("hidden")) return;
    const rect = target.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    list.insertBefore(dragging, before ? target : target.nextSibling);
  });
}

function bindPointerDrag() {
  let dragging = null;
  let pointerId = null;
  let moved = false;
  list.querySelectorAll(".drag-handle").forEach(handle => {
    handle.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse") return; // desktop handled by native drag
      dragging = handle.closest(".item");
      pointerId = e.pointerId;
      moved = false;
      dragging.classList.add("dragging");
      handle.setPointerCapture(pointerId);
      e.preventDefault();
    });
    handle.addEventListener("pointermove", e => {
      if (!dragging || e.pointerId !== pointerId) return;
      moved = true;
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".item");
      if (!target || target === dragging || target.classList.contains("hidden")) return;
      const rect = target.getBoundingClientRect();
      list.insertBefore(dragging, e.clientY < rect.top + rect.height/2 ? target : target.nextSibling);
      e.preventDefault();
    });
    const end = e => {
      if (!dragging || e.pointerId !== pointerId) return;
      dragging.classList.remove("dragging");
      dragging = null; pointerId = null;
      updateRanks(); saveOrder();
      if (moved) showToast("排序已保存");
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  });
}

function orderedText() {
  return [...list.querySelectorAll(".item")].map((el, i) => {
    const note = notes[el.dataset.name] ? `（备注：${notes[el.dataset.name]}）` : "";
    return `${i+1}. ${el.dataset.name}${note}`;
  }).join("\n");
}
document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(orderedText());
    showToast("排序已复制");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = orderedText();
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    showToast("排序已复制");
  }
});
document.getElementById("downloadBtn").addEventListener("click", () => {
  const blob = new Blob(["专业兴趣排序\n\n" + orderedText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "专业兴趣排序.txt";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("确定恢复网页初始顺序吗？个人备注会保留。")) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
  showToast("已恢复初始顺序");
});
document.getElementById("expandAll").addEventListener("click", e => {
  expandedAll = !expandedAll;
  list.querySelectorAll(".item").forEach(item => {
    item.classList.toggle("open", expandedAll);
    item.querySelector(".expand").textContent = expandedAll ? "⌃" : "⌄";
  });
  e.target.textContent = expandedAll ? "全部收起" : "全部展开";
});
searchInput.addEventListener("input", applyFilter);

categoryButtons();
render();
</script>
